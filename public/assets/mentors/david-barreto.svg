<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#590C8B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1A0626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D0314" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5470"/>
      <stop offset="50%" stop-color="#D1B3E0"/>
      <stop offset="100%" stop-color="#22E19D"/>
    </linearGradient>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#D1B3E0" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#pixelGrid)"/>

  <!-- Outer Neon Frame -->
  <rect x="18" y="18" width="364" height="364" rx="28" fill="none" stroke="#FF5470" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="26" y="26" width="348" height="348" rx="20" fill="none" stroke="#590C8B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Corner Pixel Accents -->
  <rect x="22" y="22" width="10" height="10" fill="#FF5470" opacity="0.8"/>
  <rect x="368" y="22" width="10" height="10" fill="#FF5470" opacity="0.8"/>
  <rect x="22" y="368" width="10" height="10" fill="#FF5470" opacity="0.8"/>
  <rect x="368" y="368" width="10" height="10" fill="#FF5470" opacity="0.8"/>

  <!-- Avatar Circle / Shield -->
  <circle cx="200" cy="170" r="82" fill="#140620" stroke="url(#artGrad)" stroke-width="3.5" filter="drop-shadow(0 0 16px rgba(255,84,112,0.35))"/>
  
  <!-- Cyber Silhouette / Pixel Art Icon (Palette + ✦ Sparkles) -->
  <g fill="none" stroke="#FF5470" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Palette Outline -->
    <path d="M200 135 C160 135 145 160 145 180 C145 200 165 210 185 205 C195 202 205 208 205 215 C205 220 215 222 225 218 C250 208 255 175 255 165 C255 145 230 135 200 135 Z" fill="#200B2B" fill-opacity="0.6"/>
    <!-- Color Drops -->
    <circle cx="170" cy="160" r="4.5" fill="#22E19D" stroke="none"/>
    <circle cx="195" cy="152" r="4.5" fill="#FF5470" stroke="none"/>
    <circle cx="225" cy="162" r="4.5" fill="#D1B3E0" stroke="none"/>
    <circle cx="235" cy="185" r="4.5" fill="#FCEE0A" stroke="none"/>
  </g>

  <!-- Initials Badge -->
  <rect x="160" y="222" width="80" height="28" rx="6" fill="#0D0314" stroke="#FF5470" stroke-width="1.5"/>
  <text x="200" y="241" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="14" fill="#FF5470" text-anchor="middle" letter-spacing="3">DB</text>

  <!-- Discipline Pill -->
  <g transform="translate(145, 276)">
    <rect width="110" height="26" rx="13" fill="#FF5470" fill-opacity="0.15" stroke="#FF5470" stroke-width="1"/>
    <text x="55" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#FF5470" text-anchor="middle" letter-spacing="1.5">ARTE</text>
  </g>

  <!-- Studio Tag -->
  <text x="200" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D1B3E0" text-anchor="middle" letter-spacing="0.5">Rival Arts</text>
</svg>

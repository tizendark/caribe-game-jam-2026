<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#590C8B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1A0626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D0314" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="designGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#22E19D"/>
      <stop offset="100%" stop-color="#D1B3E0"/>
    </linearGradient>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#D1B3E0" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#pixelGrid)"/>

  <!-- Outer Neon Frame -->
  <rect x="18" y="18" width="364" height="364" rx="28" fill="none" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.45"/>
  <rect x="26" y="26" width="348" height="348" rx="20" fill="none" stroke="#590C8B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Corner Pixel Accents -->
  <rect x="22" y="22" width="10" height="10" fill="#00F0FF" opacity="0.8"/>
  <rect x="368" y="22" width="10" height="10" fill="#00F0FF" opacity="0.8"/>
  <rect x="22" y="368" width="10" height="10" fill="#00F0FF" opacity="0.8"/>
  <rect x="368" y="368" width="10" height="10" fill="#00F0FF" opacity="0.8"/>

  <!-- Avatar Circle / Shield -->
  <circle cx="200" cy="170" r="82" fill="#140620" stroke="url(#designGrad)" stroke-width="3.5" filter="drop-shadow(0 0 16px rgba(0,240,255,0.35))"/>
  
  <!-- Cyber Silhouette / Gamepad Icon -->
  <g fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gamepad Body -->
    <path d="M160 152 C150 152 145 162 145 180 C145 198 152 206 160 206 C168 206 174 196 182 196 L218 196 C226 196 232 206 240 206 C248 206 255 198 255 180 C255 162 250 152 240 152 Z" fill="#0B1D28" fill-opacity="0.7"/>
    <!-- D-Pad Plus -->
    <path d="M168 170 L168 186 M160 178 L176 178" stroke="#22E19D" stroke-width="3.5"/>
    <!-- Action Buttons -->
    <circle cx="226" cy="173" r="3" fill="#FF5470" stroke="none"/>
    <circle cx="236" cy="183" r="3" fill="#00F0FF" stroke="none"/>
  </g>

  <!-- Initials Badge -->
  <rect x="160" y="222" width="80" height="28" rx="6" fill="#0D0314" stroke="#00F0FF" stroke-width="1.5"/>
  <text x="200" y="241" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="14" fill="#00F0FF" text-anchor="middle" letter-spacing="3">JM</text>

  <!-- Discipline Pill -->
  <g transform="translate(145, 276)">
    <rect width="110" height="26" rx="13" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-width="1"/>
    <text x="55" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00F0FF" text-anchor="middle" letter-spacing="1.5">DISEÑO</text>
  </g>

  <!-- Studio Tag -->
  <text x="200" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D1B3E0" text-anchor="middle" letter-spacing="0.5">Maleiwa Studio</text>
</svg>

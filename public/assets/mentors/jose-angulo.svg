<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#590C8B" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1A0626" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0D0314" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="audioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="50%" stop-color="#D1B3E0"/>
      <stop offset="100%" stop-color="#22E19D"/>
    </linearGradient>
    <pattern id="pixelGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="none" stroke="#D1B3E0" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>
  <rect width="400" height="400" fill="url(#pixelGrid)"/>

  <!-- Outer Neon Frame -->
  <rect x="18" y="18" width="364" height="364" rx="28" fill="none" stroke="#D1B3E0" stroke-width="2" stroke-opacity="0.5"/>
  <rect x="26" y="26" width="348" height="348" rx="20" fill="none" stroke="#590C8B" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Corner Pixel Accents -->
  <rect x="22" y="22" width="10" height="10" fill="#D1B3E0" opacity="0.8"/>
  <rect x="368" y="22" width="10" height="10" fill="#D1B3E0" opacity="0.8"/>
  <rect x="22" y="368" width="10" height="10" fill="#D1B3E0" opacity="0.8"/>
  <rect x="368" y="368" width="10" height="10" fill="#D1B3E0" opacity="0.8"/>

  <!-- Avatar Circle / Shield -->
  <circle cx="200" cy="170" r="82" fill="#140620" stroke="url(#audioGrad)" stroke-width="3.5" filter="drop-shadow(0 0 16px rgba(209,179,224,0.4))"/>
  
  <!-- Cyber Silhouette / Sound Waveform Icon -->
  <g fill="#22E19D">
    <rect x="156" y="162" width="6" height="16" rx="3"/>
    <rect x="168" y="152" width="6" height="36" rx="3"/>
    <rect x="180" y="142" width="6" height="56" rx="3"/>
    <rect x="192" y="134" width="6" height="72" rx="3" fill="#D1B3E0"/>
    <rect x="204" y="134" width="6" height="72" rx="3" fill="#D1B3E0"/>
    <rect x="216" y="142" width="6" height="56" rx="3"/>
    <rect x="228" y="152" width="6" height="36" rx="3"/>
    <rect x="240" y="162" width="6" height="16" rx="3"/>
  </g>

  <!-- Initials Badge -->
  <rect x="160" y="222" width="80" height="28" rx="6" fill="#0D0314" stroke="#D1B3E0" stroke-width="1.5"/>
  <text x="200" y="241" font-family="'Courier New', monospace, sans-serif" font-weight="900" font-size="14" fill="#D1B3E0" text-anchor="middle" letter-spacing="3">JA</text>

  <!-- Discipline Pill -->
  <g transform="translate(145, 276)">
    <rect width="110" height="26" rx="13" fill="#D1B3E0" fill-opacity="0.15" stroke="#D1B3E0" stroke-width="1"/>
    <text x="55" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#D1B3E0" text-anchor="middle" letter-spacing="1.5">AUDIO</text>
  </g>

  <!-- Studio Tag -->
  <text x="200" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#D1B3E0" text-anchor="middle" letter-spacing="0.5">Joseisaudio</text>
</svg>
